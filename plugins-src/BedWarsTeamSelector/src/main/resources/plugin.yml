name: BedWarsTeamSelector
version: 1.1.3
main: com.bwteam.selector.TeamSelectorPlugin
api-version: '1.21'
description: BedWars1058 team selector GUI + /zd party system for Paper 1.21.x
author: bwteam
softdepend:
  - BedWars1058

commands:
  bwteam:
    description: 打开队伍选择界面
    usage: /bwteam [reload]
    aliases: [xuanze]
  zd:
    description: 组队指令
    usage: /zd
    aliases: [zudui]

permissions:
  bwteam.use:
    description: 允许使用队伍选择器
    default: true
  bwteam.party:
    description: 允许使用 /zd 组队指令
    default: true
  bwteam.admin:
    description: 允许重载插件配置
    default: op
